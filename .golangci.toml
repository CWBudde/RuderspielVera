version = '2'

# Linter set adapted from MeKo-Tech/ewws-render: everything on, minus the
# noisy or project-irrelevant linters below.
#
# exhaustruct stays disabled: the engine builds large view/contract structs
# (GameView, RegattaView, ...) where zero values are intended defaults, so
# demanding every field be set would flag nearly every literal.
[linters]
default = 'all'
disable = [
  'depguard',
  'exhaustive',
  'exhaustruct',
  'exhaustruct_v5',
  'godox',
  'gomodguard',
  'ireturn',
  'mnd',
  'musttag',
  'nlreturn',
  'sqlclosecheck',
  'wsl',
]
enable = ['gomodguard_v2', 'wsl_v5']

[linters.settings]
[linters.settings.tagliatelle]
[linters.settings.tagliatelle.case]
[linters.settings.tagliatelle.case.rules]
json = 'camel'

# Short names are the codebase convention: two-letter domain abbreviations
# (pl = player, pv = phase view, cr = crew, cs = competition state, ...) are
# allowed everywhere, and single letters are fine within ~15 lines.
[linters.settings.varnamelen]
min-name-length = 2
max-distance = 15
ignore-names = ['ok', 'id', 'mw', 'rt', 'db', 'tx']
# Core domain values keep their one-letter names throughout the codebase.
ignore-decls = [
  'w http.ResponseWriter',
  'r *http.Request',
  'g *Game',
  'g *engine.Game',
  'd *Data',
  'd *data.Data',
  'p *phase',
  'p *problems',
  'b *brain',
  'c *compModel',
  'e *gameEntry',
  's *Service',
]

[linters.settings.wsl_v5]
allow-first-in-block = true
allow-whole-block = false
branch-max-lines = 2
disable = ['decl']

# Engine and bot functions mirror rule sections; up to 15 branches keeps one
# rule in one place instead of scattering it over helpers.
[linters.settings.cyclop]
max-complexity = 15

[linters.exclusions]
generated = 'lax'
presets = ['comments', 'common-false-positives', 'legacy', 'std-error-handling']
paths = ['third_party$', 'builtin$', 'examples$', 'web$', 'art$']

[[linters.exclusions.rules]]
linters = ['gosec']
text = 'G601:'

# The game uses seeded, deterministic math/rand on purpose (replays, sims);
# crypto randomness would break reproducibility.
[[linters.exclusions.rules]]
linters = ['gosec']
text = 'G404:'

[[linters.exclusions.rules]]
linters = ['gochecknoglobals', 'gochecknoinits']
path = 'cmd/.*\.go'

[[linters.exclusions.rules]]
linters = ['err113', 'wrapcheck']
path = 'cmd/.*\.go'

# CLI tools under tools/ get the same treatment as cmd/.
[[linters.exclusions.rules]]
linters = ['err113', 'wrapcheck']
path = 'tools/.*\.go'

# Command-line programs report to stdout on purpose.
[[linters.exclusions.rules]]
linters = ['forbidigo']
path = '(cmd|tools)/.*\.go'

# cmd/gendata holds name lists; repeated first names are data, not constants.
[[linters.exclusions.rules]]
linters = ['goconst']
path = 'cmd/gendata/.*\.go'

# Tests are white-box on purpose (they drive unexported engine state), test
# tables repeat fixture IDs, and scenario tests are long linear scripts whose
# assertions inflate complexity metrics.
[[linters.exclusions.rules]]
linters = ['testpackage', 'goconst', 'cyclop', 'gocognit', 'gocyclo', 'funlen']
path = '_test\.go'

# Static game data (stat names, effect tables, embedded JSON cache) is
# package-level by design.
[[linters.exclusions.rules]]
linters = ['gochecknoglobals']
path = 'internal/data/.*\.go'

# Read-only engine lookup tables (display names, age orderings, stat order).
[[linters.exclusions.rules]]
linters = ['gochecknoglobals']
path = 'internal/engine/.*\.go'
text = '^(AllStats|\w+Names|ageOrder|ageRank) is a global variable'

[severity]
default = 'warn'

[[severity.rules]]
linters = ['exhaustive', 'exhaustruct', 'exhaustruct_v5', 'godox']
severity = 'info'

[formatters]
enable = ['gci', 'gofumpt', 'goimports']

# Without module-path, gofumpt treats the dot-less module name `ruderspiel`
# as a standard-library import and fights gci's separate prefix section.
[formatters.settings.gofumpt]
module-path = 'ruderspiel'

[formatters.settings.gci]
sections = ['standard', 'default', 'prefix(ruderspiel)']

[formatters.settings.goimports]
local-prefixes = ['ruderspiel']

[formatters.exclusions]
generated = 'lax'
paths = ['third_party$', 'builtin$', 'examples$', 'web$', 'art$']
